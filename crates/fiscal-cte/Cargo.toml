[package]
name = "fiscal-cte"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Types and XML builder for the Brazilian CT-e (Conhecimento de Transporte Eletrônico, model 57)"
license = "MIT"
repository = "https://github.com/JoaoHenriqueBarbosa/fiscal-rs"
keywords = ["cte", "fiscal", "brazil", "xml", "transport"]
categories = ["encoding"]

[features]
ts = ["dep:ts-rs", "fiscal-core/ts"]

[dependencies]
fiscal-core = { path = "../fiscal-core", version = "0.7.0" }
fiscal-crypto = { path = "../fiscal-crypto", version = "0.2.5" }
quick-xml = { version = "0.39", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
ts-rs = { version = "12", features = ["serde-compat", "chrono-impl"], optional = true }

[dev-dependencies]
fiscal-crypto = { path = "../fiscal-crypto", version = "0.2.5" }
fiscal-xsd = { path = "../fiscal-xsd", version = "0.1.0", features = ["cte", "nfse"] }
